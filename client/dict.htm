<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="angular-1.8.2/angular-1.8.2/angular.min.js"></script>
    <title>Language Translator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 20px;
            background-color: #f8f9fa;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4a5568;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        button {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .primary-btn {
            background-color: #4299e1;
            color: white;
        }

        .primary-btn:hover {
            background-color: #3182ce;
        }

        .secondary-btn {
            background-color: #48bb78;
            color: white;
        }

        .secondary-btn:hover {
            background-color: #38a169;
        }

        .result-card {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: #f7fafc;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
        }

        .result-card h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #2d3748;
        }

        .error-message {
            color: #e53e3e;
            margin-top: 1rem;
            padding: 0.5rem;
            background-color: #fff5f5;
            border-radius: 4px;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div ng-app="dictApp" ng-controller="dictCtrl">
        <div class="container">
            <h1>Language Translator</h1>
            
            <div class="input-group">
                <label for="english">English</label>
                <input type="text" id="english" ng-model="eng" placeholder="Enter English text">
            </div>

            <div class="input-group">
                <label for="amharic">Amharic</label>
                <input type="text" id="amharic" ng-model="amh" placeholder="Enter Amharic text">
            </div>

            <div class="button-group">
                <button class="primary-btn" ng-click="to_eng(amh)">Translate to English</button>
                <button class="secondary-btn" ng-click="to_amh(eng)">Translate to Amharic</button>
            </div>

            <div class="result-card" ng-show="eng || amh">
                <h3>Translation Result</h3>
                <div class="result-content">
                    <h1 ng-show="eng">English: {{eng}}</h1>
                    <h1 ng-show="amh">Amharic: {{amh}}</h1>
                </div>
            </div>

            <div class="error-message" ng-show="errorMessage">
                {{errorMessage}}
            </div>
        </div>
    </div>
</body>
</html>

<script>
    const api_base_url = 'http://127.0.0.1:5000';
    var app = angular.module('dictApp', []);
    
    app.controller('dictCtrl', function($scope){
        $scope.errorMessage = '';
        
        $scope.to_eng = function(amh){
            if (!amh) {
                $scope.errorMessage = 'Please enter Amharic text to translate';
                return;
            }
            
            $scope.errorMessage = '';
            fetch(`${api_base_url}/to/eng/${amh}`, { method: 'GET' })
            .then(function(response){
                if (!response.ok) throw new Error('Translation failed');
                return response.json();
            })
            .then(function(data){
                $scope.$apply(() => {
                    $scope.eng = data[0]?.eng;
                    $scope.amh = '';  // Clear other field
                });
            })
            .catch(error => {
                $scope.$apply(() => {
                    $scope.errorMessage = 'Error: ' + error.message;
                });
                console.error('Error:', error);
            });
        }

        $scope.to_amh = function(eng){
            if (!eng) {
                $scope.errorMessage = 'Please enter English text to translate';
                return;
            }
            
            $scope.errorMessage = '';
            fetch(`${api_base_url}/to/amh/${eng}`, { method: 'GET' })
            .then(function(response){
                if (!response.ok) throw new Error('Translation failed');
                return response.json();
            })
            .then(function(data) {
                $scope.$apply(() => {
                    $scope.amh = data[0]?.amh;
                    $scope.eng = '';  // Clear other field
                });
            })
            .catch(error => {
                $scope.$apply(() => {
                    $scope.errorMessage = 'Error: ' + error.message;
                });
                console.error('Error:', error);
            });
        }
    });
</script>
